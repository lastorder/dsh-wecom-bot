name: CI

# Runs the full self-verification flow (build, typecheck, tests over the
# built bundle) on every push to the default branch and every pull request,
# so a break is found at the commit that caused it rather than at release
# time, when release.yml runs the same `pnpm run verify` against a tag.
on:
  push:
    branches:
      - main
  pull_request:

# Read-only: nothing here publishes, tags, or writes to the repository. The
# release workflow is the only thing that needs write scopes.
permissions:
  contents: read

# A superseded run tells you nothing useful, so cancel it rather than paying
# for it. Never cancel a push to the default branch, whose result is the
# recorded state of the branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide the result on the others.
      fail-fast: false
      matrix:
        # 24 is Active LTS and the primary target, 22 is the lowest version
        # `engines` allows, 26 is Current.
        node-version: ['22', '24', '26']
    name: verify (Node ${{ matrix.node-version }})
    steps:
      - name: Check out the commit
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (build + typecheck + test)
        run: pnpm run verify
